# Site de présentation de Gná — nginx derrière Nginx Proxy Manager (NPM)
#
#   Visiteur ──HTTPS──► NPM (certificat Let's Encrypt, HSTS) ──HTTP──► ce nginx (fichiers du site)
#
# À placer dans /etc/nginx/sites-available/gna-web, puis activer avec un lien dans sites-enabled.
# NPM : 10.0.66.1 — serveur du site : 10.0.66.12 — domaine : gna.gjallarbru.ovh
# HTTPS et HSTS sont gérés par NPM : voir deploy/README.md.

server {
    listen 80;
    listen [::]:80;
    server_name gna.gjallarbru.ovh;

    root /var/www/gna-web;
    index index.html;

    # Seul NPM peut joindre ce site (plus la machine elle-même, pour les tests avec curl)
    allow 10.0.66.1;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # Pas de set_real_ip_from ici : il remplacerait l'adresse de NPM par celle du visiteur
    # avant le contrôle allow/deny, et tout le monde serait refusé. Les adresses des
    # visiteurs sont dans les journaux de NPM.

    # Redirections relatives : sinon nginx renverrait vers http://… avec son propre port
    absolute_redirect off;

    # Ne pas annoncer la version de nginx
    server_tokens off;

    # En-têtes de sécurité, transmis tels quels par NPM au visiteur.
    # La CSP est ici seulement (plus de balise <meta> dans les pages). Elle autorise
    # Plausible (statistiques auto-hébergées) : script-src pour le script, connect-src pour l'envoi des visites.
    # HSTS n'est pas ici : il est activé dans NPM (onglet SSL), pour ne pas l'envoyer en double.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://plausible.gjallarbru.ovh; connect-src https://plausible.gjallarbru.ovh; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Seules les méthodes de lecture sont utiles à un site statique
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Pas d'affichage du contenu des dossiers, pas de fichiers cachés (.git, .env…)
    autoindex off;
    location ~ /\. { deny all; }

    # Ce dossier de configuration n'a pas à être servi
    location /deploy/ { deny all; }

    # Paquets : téléchargés comme fichiers, jamais interprétés par le navigateur
    location /telechargements/ {
        # Bon type de fichier : Android ne propose d'installer un APK que s'il est servi comme tel
        types {
            application/vnd.debian.binary-package deb;
            application/vnd.android.package-archive apk;
            application/vnd.microsoft.portable-executable exe;
            application/octet-stream AppImage;
        }
        default_type text/plain;
        # add_header dans un bloc location remplace ceux du serveur : on les répète
        add_header Content-Disposition "attachment" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
