[package]
name = "gna-app"
version = "0.13.0"
description = "Application Gná : bastion d'accès SSH, VNC et RDP"
edition = "2021"
rust-version = "1.90"

[lib]
name = "gna_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gna-relay = { path = "../relay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
