# Compilation de l'application Gná pour Linux, Windows et Android.
# Déclenchement : manuel (onglet Actions → « Application Gná » → Run workflow)
# ou en poussant une étiquette « app-v* » (ex. git tag app-v0.1.0 && git push --tags).
#
# Signature Android (facultative, recommandée) : ajouter dans Settings → Secrets → Actions
#   ANDROID_KEYSTORE_B64       le fichier .jks encodé en base64 (base64 -w0 gna.jks)
#   ANDROID_KEYSTORE_PASSWORD  le mot de passe du keystore
#   ANDROID_KEY_ALIAS          l'alias de la clé
# Sans ces secrets, un APK de débogage (installable, signé avec une clé de test) est produit.

name: Application Gná

on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

defaults:
  run:
    working-directory: app

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: gna-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi

  android:
    runs-on: ubuntu-22.04
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - run: npm ci
      - name: Projet Android
        run: |
          npx tauri android init --ci
          bash scripts/android-patch.sh
      - name: APK signé (release)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          npx tauri android build --apk --target aarch64 --target armv7
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/gna.jks"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/gna.jks" --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" --out "$GITHUB_WORKSPACE/gna-android.apk" "$RUNNER_TEMP/aligned.apk"
      - name: APK de débogage
        if: env.HAS_KEYSTORE != 'true'
        run: |
          npx tauri android build --apk --debug --target aarch64 --target armv7
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)" "$GITHUB_WORKSPACE/gna-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: gna-android
          path: gna-android*.apk
