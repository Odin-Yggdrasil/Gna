# Publication d'une version de Gná : serveur (.deb), application Linux (.deb, AppImage) et
# Windows (installeur .exe), puis création de la « Release » GitHub.
# L'APK Android est compilé et signé en local (app/scripts/build-android.sh), puis ajouté
# à la Release : gh release upload v<version> Gna-<version>-android.apk
#
# Déclenchement :
#   - en poussant une étiquette de version :  git tag v0.13.0 && git push origin v0.13.0
#     (le numéro doit correspondre au fichier VERSION) → compilation + Release ;
#   - à la main (Actions → « Publication » → Run workflow) : compilation seule (fichiers dans
#     les « Artifacts » de l'exécution), ou Release complète en cochant « Publier ».

name: Publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier la Release (crée l'étiquette v<VERSION>)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(cat VERSION)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$V" ]]; then
            echo "::error::L'étiquette $GITHUB_REF_NAME ne correspond pas au fichier VERSION ($V)"; exit 1
          fi
          for f in app/src-tauri/tauri.conf.json app/package.json; do
            grep -q "\"version\": \"$V\"" "$f" || { echo "::error::$f n'est pas en version $V"; exit 1; }
          done
          echo "version=$V" >> "$GITHUB_OUTPUT"

  server:
    needs: version
    runs-on: ubuntu-22.04   # glibc 2.35 : paquet compatible Debian 12+ et Ubuntu 22.04+
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"   # même version que les compilations locales
      - uses: dtolnay/rust-toolchain@stable
      - run: make build
      - run: go test ./...
      - run: ./deploy/deb/build.sh ${{ needs.version.outputs.version }}
      - run: mv dist/gna_*_amd64.deb "dist/gna-server_${{ needs.version.outputs.version }}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/*.deb

  app-linux:
    needs: version
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci
      - run: npx tauri build --bundles deb,appimage
      - run: |
          V=${{ needs.version.outputs.version }}
          mkdir -p ../out
          cp src-tauri/target/release/bundle/deb/*.deb "../out/gna-app_${V}_amd64.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "../out/Gna-${V}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: out/*

  app-windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - run: |
          mkdir -p ../out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "../out/Gna-${{ needs.version.outputs.version }}-windows-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: out/*

  release:
    if: (github.ref_type == 'tag' || inputs.publier) && !cancelled() && needs.server.result == 'success' && needs.app-linux.result == 'success' && needs.app-windows.result == 'success'
    needs: [version, server, app-linux, app-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.version.outputs.version }}
          cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          NOTES=docs/releases/$V.md
          [[ -f $NOTES ]] || { echo "Gná $V" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" files/* --clobber
          else
            gh release create "v$V" files/* --target "$GITHUB_SHA" --title "Gná $V" --notes-file "$NOTES"
          fi
