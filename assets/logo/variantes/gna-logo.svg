<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b1a"/>
      <stop offset="1" stop-color="#14062a"/>
    </linearGradient>
    <linearGradient id="grad" x1="170" y1="180" x2="1015" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="letters" fill="none" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
      <path d="M375 215 A120 120 0 1 0 410 300 L305 300"/>
      <path d="M495 420 L495 180 L700 420 L700 180"/>
      <path d="M785 420 L900 180 L1015 420"/>
      <path d="M852 345 L948 345"/>
    </g>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <ellipse cx="600" cy="300" rx="560" ry="260" fill="url(#halo)"/>

  <!-- décalage glitch -->
  <use href="#letters" stroke="#00f0ff" opacity="0.45" transform="translate(-7 4)"/>
  <use href="#letters" stroke="#ff2bd6" opacity="0.45" transform="translate(7 -4)"/>
  <!-- lettres principales -->
  <use href="#letters" stroke="url(#grad)" filter="url(#glow)"/>

  <!-- traits de vitesse -->
  <g stroke-linecap="round" stroke-width="6">
    <line x1="80" y1="490" x2="520" y2="490" stroke="#00f0ff" stroke-opacity="0.7"/>
    <line x1="680" y1="490" x2="1120" y2="490" stroke="#ff2bd6" stroke-opacity="0.7"/>
  </g>
  <polygon points="600,474 616,490 600,506 584,490" fill="#ffffff"/>
</svg>
